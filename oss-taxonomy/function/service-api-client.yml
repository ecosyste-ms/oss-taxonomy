name: service-api-client
description: >-
  Providing callers with operations for a named remote service or product API, such as querying its resources
  or submitting records. This includes libraries, CLIs and automation actions that expose these operations
  to users and excludes packages that only install other clients.
examples:
  - twilio-python
  - go-github
  - codecov/uploader
related:
  - http-client
  - sdk
aliases:
  - service-specific-api-client
ecosystems:
  - pypi
  - go
  - npm
tags:
  - api
  - client
